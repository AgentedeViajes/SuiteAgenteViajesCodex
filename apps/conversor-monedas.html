<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversor de Monedas | Suite del Agente</title><link rel="stylesheet" href="../assets/subapps.css"><style>.converter{max-width:760px;margin:auto}.conversion-result{padding:32px;text-align:center;background:linear-gradient(130deg,#061b33,#1763a6);border-radius:18px;color:#fff}.conversion-result span{display:block;color:#bfe5fa}.conversion-result strong{display:block;margin:6px 0;font-size:clamp(2rem,6vw,4rem)}.swap{width:46px;height:46px;padding:0;border-radius:50%}</style></head><body>
<header class="topbar"><div class="shell topbar__inner"><a class="brand" href="../index.html"><img src="../logo.png" alt="Tresor Travel"></a><a class="back-link" href="../index.html">‹ Volver a la suite</a></div></header><main class="app-main"><div class="shell"><div class="app-intro"><p class="eyebrow">Tipo de cambio</p><h1>Conversor de Monedas</h1><p>Convierte importes utilizando cotizaciones de referencia actualizadas diariamente.</p></div><section class="panel converter"><div class="panel__header"><h2>Conversión</h2><p>Selecciona la moneda de origen y destino.</p></div><div class="panel__body"><div class="field"><label for="amount">Importe</label><input id="amount" type="number" min="0" step="0.01" value="1000"></div><div style="display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:end"><div class="field"><label for="from">Moneda origen</label><select id="from"></select></div><div class="field"><button class="btn btn--secondary swap" id="swap" type="button" aria-label="Intercambiar monedas">⇄</button></div><div class="field"><label for="to">Moneda destino</label><select id="to"></select></div></div><div class="button-row"><button class="btn btn--primary" id="convert" type="button">Convertir</button></div><div class="status" id="status"></div><div class="conversion-result" id="result" style="display:none;margin-top:22px"><span id="source-amount"></span><strong id="converted"></strong><span id="rate"></span></div><p class="hint" style="text-align:center;margin-top:14px">Cotizaciones indicativas. <a href="https://www.exchangerate-api.com" target="_blank" rel="noopener">Rates by Exchange Rate API</a>.</p></div></section></div></main><footer><div class="shell footer-inner"><p>© 2026 Tresor Travel</p><p>Uso interno</p></div></footer><script src="../assets/subapps.js?v=20260918-4"></script><script>
const {setStatus}=SuiteUtils;const currencies={USD:'Dólar estadounidense',EUR:'Euro',GBP:'Libra esterlina',ARS:'Peso argentino',BRL:'Real brasileño',CLP:'Peso chileno',UYU:'Peso uruguayo',MXN:'Peso mexicano',CAD:'Dólar canadiense',CHF:'Franco suizo',JPY:'Yen japonés',AUD:'Dólar australiano'};const options=Object.entries(currencies).map(([c,n])=>`<option value="${c}">${c} · ${n}</option>`).join('');document.querySelector('#from').innerHTML=options;document.querySelector('#to').innerHTML=options;document.querySelector('#from').value='USD';document.querySelector('#to').value='ARS';
const fmt=(v,c)=>new Intl.NumberFormat('es-AR',{style:'currency',currency:c,maximumFractionDigits:c==='ARS'?2:4}).format(v);document.querySelector('#swap').onclick=()=>{const a=document.querySelector('#from'),b=document.querySelector('#to'),v=a.value;a.value=b.value;b.value=v;};
async function rates(base){const cacheKey=`suite-rates-${base}`,cached=localStorage.getItem(cacheKey);if(cached){const parsed=JSON.parse(cached);if(Date.now()-parsed.saved<86400000)return parsed.data;}const response=await fetch(`https://open.er-api.com/v6/latest/${base}`);const data=await response.json();if(!response.ok||data.result!=='success')throw new Error('No fue posible obtener las cotizaciones. Revisa tu conexión.');localStorage.setItem(cacheKey,JSON.stringify({saved:Date.now(),data}));return data;}
document.querySelector('#convert').onclick=async()=>{const amount=Number(document.querySelector('#amount').value),from=document.querySelector('#from').value,to=document.querySelector('#to').value,status=document.querySelector('#status'),button=document.querySelector('#convert');if(!Number.isFinite(amount)||amount<0){setStatus(status,'Ingresa un importe válido.','error');return;}button.disabled=true;setStatus(status,'Consultando cotizaciones…','info');try{const data=await rates(from),rate=data.rates[to],result=amount*rate;document.querySelector('#source-amount').textContent=`${fmt(amount,from)} equivalen a`;document.querySelector('#converted').textContent=fmt(result,to);document.querySelector('#rate').textContent=`1 ${from} = ${new Intl.NumberFormat('es-AR',{maximumFractionDigits:6}).format(rate)} ${to} · Actualizado ${new Date(data.time_last_update_unix*1000).toLocaleDateString('es-AR')}`;document.querySelector('#result').style.display='block';setStatus(status,'Conversión actualizada.','success');}catch(e){setStatus(status,e.message,'error');}finally{button.disabled=false;}};
</script></body></html>
